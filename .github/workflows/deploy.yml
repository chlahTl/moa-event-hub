name: Deploy Moa

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moa-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm test

      - name: Create or find D1 database
        shell: bash
        run: |
          database_list="$(npx wrangler@latest d1 list --json)"
          database_id="$(DB_LIST_JSON="$database_list" node -e '
            const rows = JSON.parse(process.env.DB_LIST_JSON || "[]");
            const match = rows.find((row) => row.name === "moa-event-hub-db");
            process.stdout.write(match?.uuid || match?.database_id || "");
          ')"

          if [ -z "$database_id" ]; then
            npx wrangler@latest d1 create moa-event-hub-db --location apac
            database_list="$(npx wrangler@latest d1 list --json)"
            database_id="$(DB_LIST_JSON="$database_list" node -e '
              const rows = JSON.parse(process.env.DB_LIST_JSON || "[]");
              const match = rows.find((row) => row.name === "moa-event-hub-db");
              process.stdout.write(match?.uuid || match?.database_id || "");
            ')"
          fi

          if [ -z "$database_id" ]; then
            echo "D1 database ID could not be resolved."
            exit 1
          fi

          echo "MOA_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"

      - name: Build production bundle
        run: npm run build

      - name: Configure production bindings
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "dist/server/wrangler.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));

          config.name = "moa-event-hub";
          config.account_id = process.env.CLOUDFLARE_ACCOUNT_ID;
          config.d1_databases = [{
            binding: "DB",
            database_name: "moa-event-hub-db",
            database_id: process.env.MOA_D1_DATABASE_ID,
          }];

          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          NODE

      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          deploy_output="$(npx wrangler@latest deploy --config dist/server/wrangler.json)"
          echo "$deploy_output"
          deploy_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)"

          {
            echo "## 모아 배포 완료"
            if [ -n "$deploy_url" ]; then
              echo ""
              echo "서비스 주소: [$deploy_url]($deploy_url)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
