name: Verify Moa

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moa-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Test production bundle and core flows
        run: npm test

      - name: Explain the publishing boundary
        run: |
          {
            echo "## 모아 검증 완료"
            echo
            echo "관리자 인증은 Sites가 제공하는 ChatGPT 로그인 계층을 사용합니다."
            echo "운영 데이터베이스 마이그레이션과 배포는 별도 승인된 Sites 배포에서 진행합니다."
          } >> "$GITHUB_STEP_SUMMARY"
